<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Face mask PoC</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header>
      <h1>Privacy mask PoC</h1>
      <p>Runs on this laptop only. Nothing is uploaded. Recordings are saved to your Downloads folder.</p>
    </header>

    <main>
      <section class="stage">
        <div class="controls">
          <label>Laptop name <input id="laptop" type="text" placeholder="e.g. lowend-1" /></label>
          <label>Scenario <select id="scenario"></select></label>
          <label class="check"><input id="saveRaw" type="checkbox" checked /> Also save raw video (research only)</label>
        </div>
        <div class="buttons">
          <button id="btnCamera">Start camera</button>
          <button id="btnRecord" disabled>Start recording</button>
          <button id="btnStop" disabled>Stop and save</button>
        </div>
        <div class="view">
          <canvas id="out" width="1280" height="720"></canvas>
        </div>
        <label class="typing">Typing box (key times are logged while recording, never the keys)
          <textarea id="typing" rows="3" placeholder="Type here during the recording..."></textarea>
        </label>
      </section>

      <aside class="panel">
        <h2>Live</h2>
        <dl>
          <dt>Status</dt><dd id="vStatus">idle</dd>
          <dt>FPS</dt><dd id="vFps">-</dd>
          <dt>Tracking lost</dt><dd id="vLost">-</dd>
          <dt>Faces</dt><dd id="vFaces">-</dd>
          <dt>Yaw / pitch</dt><dd id="vPose">-</dd>
          <dt>Gaze h / v</dt><dd id="vGaze">-</dd>
          <dt>Delegate</dt><dd id="vDelegate">-</dd>
          <dt>Recording</dt><dd id="vRec">-</dd>
        </dl>
      </aside>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
