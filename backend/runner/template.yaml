AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >-
  C++ runner for student code. A container-image Lambda in a VPC with private subnets only:
  no NAT, no internet gateway, no VPC endpoints, and a security group that allows no outbound
  traffic. Its role can only write logs and manage its own network interfaces.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - production

Resources:
  # ------------------------------------------
  # NETWORK: a VPC with nothing to reach
  # ------------------------------------------
  RunnerVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.20.0.0/16
      EnableDnsSupport: false
      EnableDnsHostnames: false
      Tags:
        - Key: Name
          Value: !Sub micro-credentialing-runner-${Environment}

  # No route tables are added and no gateway is attached: the only route is the VPC-local one.
  RunnerSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref RunnerVpc
      CidrBlock: 10.20.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false

  RunnerSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref RunnerVpc
      CidrBlock: 10.20.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: false

  # CloudFormation adds an allow-all egress rule to a security group unless an egress rule is
  # given. The single rule below only allows traffic to 127.0.0.1/32, which never leaves the
  # network interface, so in practice nothing can leave.
  RunnerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Runner - no inbound, no outbound
      VpcId: !Ref RunnerVpc
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 127.0.0.1/32
          Description: Placeholder that replaces the default allow-all egress rule

  # ------------------------------------------
  # EXECUTION ROLE: the credentials student code could find are made worthless
  # ------------------------------------------
  # Allow: write to its own log group, and the network-interface actions Lambda needs to put the function in a VPC.
  # Deny: the same network-interface actions whenever the request carries lambda:SourceFunctionArn for this function,
  # which AWS sets on requests made with the function's own credentials (function code, or anyone who copied them).
  # Lambda's own VPC networking does not carry that key, so it keeps working. AWS documents this as the way to stop
  # function code from using the execution role to change network interfaces.
  # No managed policy, nothing else. The function ARN is built from the fixed function name to avoid a circular reference.
  RunnerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: runner-minimum
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: WriteOwnLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/micro-credentialing-runner-${Environment}:*
              - Sid: LambdaVpcNetworking
                Effect: Allow
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeSubnets
                  - ec2:DeleteNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses
                Resource: '*'
              - Sid: DenyNetworkInterfacesToFunctionCode
                Effect: Deny
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeSubnets
                  - ec2:DeleteNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses
                Resource: '*'
                Condition:
                  ArnEquals:
                    lambda:SourceFunctionArn: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:micro-credentialing-runner-${Environment}

  # ------------------------------------------
  # FUNCTION
  # ------------------------------------------
  RunnerFunction:
    Type: AWS::Serverless::Function
    DependsOn: RunnerLogGroup # the group exists before the first invocation, so Lambda never has to create it
    Properties:
      FunctionName: !Sub micro-credentialing-runner-${Environment}
      PackageType: Image
      Architectures:
        - x86_64
      MemorySize: 1769 # one full vCPU
      Timeout: 30
      # Only logs and network interfaces (RunnerRole). No other policy, no environment variables, no secrets.
      Role: !GetAtt RunnerRole.Arn
      VpcConfig:
        SecurityGroupIds:
          - !Ref RunnerSecurityGroup
        SubnetIds:
          - !Ref RunnerSubnetA
          - !Ref RunnerSubnetB
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: ./function
      DockerTag: !Sub ${Environment}

  RunnerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/micro-credentialing-runner-${Environment}
      RetentionInDays: 14

Outputs:
  RunnerFunctionName:
    Value: !Ref RunnerFunction
  RunnerFunctionArn:
    Value: !GetAtt RunnerFunction.Arn
  RunnerRoleArn:
    Value: !GetAtt RunnerRole.Arn
