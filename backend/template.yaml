            Auth:
              Authorizer: NONE  # Webhook doesn't use Cognito auth
        # OPTIONS - NO AUTH (already public endpoint)
        OptionsWebhook:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /webhooks/bcdiploma-notification
            Method: OPTIONS
            Auth:
              Authorizer: NONE
      Policies:
        - DynamoDBReadPolicy:
            TableName: Submissions
        - DynamoDBCrudPolicy:
            TableName: Submissions
        - DynamoDBReadPolicy:
            TableName: Users
        - DynamoDBReadPolicy:
            TableName: Milestones
        - DynamoDBCrudPolicy:
            TableName: Credentials
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${BCDiplomaApiKeySecretName}*"
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${BCDiplomaIssuerIdSecretName}*"
 
  # ------------------------------------------
  # LAMBDA: Configure BCdiploma Webhook (ONE-TIME SETUP)
  # ------------------------------------------
  ConfigureWebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/webhooks/configure-bcdiploma/
      Handler: index.handler
      Description: One-time function to configure BCdiploma webhook URL
      Timeout: 30
      Events:
        ConfigureWebhook:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /admin/configure-webhook
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer
        # OPTIONS - NO AUTH (allows CORS preflight)
        OptionsConfigureWebhook:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /admin/configure-webhook
            Method: OPTIONS
            Auth:
              Authorizer: NONE
      # Users read: withHandler({ requireAdmin: true }) looks up the caller's role.
      Policies:
        - DynamoDBReadPolicy:
            TableName: Users
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${BCDiplomaApiKeySecretName}*"
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${BCDiplomaIssuerIdSecretName}*"
 
 
  # ==========================================
  # INTERVIEW FUNCTIONS (AI interview after a coding submission)
  # ==========================================

  # ------------------------------------------
  # LAMBDA: Start Interview
  # ------------------------------------------
  CreateInterviewFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/interviews/create/
      Handler: index.handler
      Description: Starts the interview for a coding submission
      Timeout: 25
      Environment:
        Variables:
          # Create starts the prepare step (runs, code status, host.v7 analysis) as its own function, asynchronously
          PREPARE_INTERVIEW_FUNCTION: !Ref PrepareInterviewFunction
      Events:
        CreateInterview:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /interviews
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer
        OptionsInterviews:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /interviews
            Method: OPTIONS
            Auth:
              Authorizer: NONE
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref InterviewsTable
        - DynamoDBReadPolicy:
            TableName: Submissions
        - DynamoDBReadPolicy:
            TableName: Milestones
        - Statement:
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource:
                - !GetAtt PrepareInterviewFunction.Arn

  # ------------------------------------------
  # LAMBDA: Prepare Interview (not an API route: Create invokes it asynchronously, so API Gateway's 29 s limit never applies)
  # ------------------------------------------
  PrepareInterviewFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/interviews/prepare/
      Handler: index.handler
      Description: Classifies the code, runs the instructor's inputs and (host.v7) analyzes the code before the first question
      Timeout: 120
      EventInvokeConfig:
        MaximumRetryAttempts: 0
      Environment:
        Variables:
          CODE_RUNNER: !Ref CodeRunner
          CODE_RUNNER_FUNCTION: !Ref RunnerFunctionName
          CODE_RUNNER_TENANT_ISOLATION: "off"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref InterviewsTable
        - DynamoDBReadPolicy:
            TableName: Submissions
        - DynamoDBReadPolicy:
            TableName: Milestones
        - DynamoDBCrudPolicy:
            TableName: !Ref RunUsageTable
        # The analysis of host.v7 uses the checker model (Converse needs bedrock:InvokeModel, in us-east-1 only).
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - !Sub "arn:aws:bedrock:us-east-1::foundation-model/${AgentCheckerModelId}"
                - !Sub "arn:aws:bedrock:us-east-1::foundation-model/${AgentWriterModelId}"
        - Statement:
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource:
                - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${RunnerFunctionName}"

  # ------------------------------------------
  # LAMBDA: Leave (abandon) an interview
  # ------------------------------------------
  AbandonInterviewFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/interviews/abandon/
      Handler: index.handler
      Description: Ends the student's interview because they left the page (no retake)
      Events:
        AbandonInterview:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /interviews/{interviewId}/abandon
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer
        OptionsInterviewAbandon:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /interviews/{interviewId}/abandon
            Method: OPTIONS
            Auth:
              Authorizer: NONE
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref InterviewsTable
        - DynamoDBReadPolicy:
            TableName: Users

  # ------------------------------------------
  # LAMBDA: Answer Interview Question
  # ------------------------------------------
  SubmitInterviewAnswerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/interviews/answer/
      Handler: index.handler
      Description: Stores an interview answer and returns the next question
      Timeout: 25
      Environment:
        Variables:
          # host.v6 runs the student's code on the instructor's inputs (same pattern as RunCodeFunction)
          CODE_RUNNER: !Ref CodeRunner
          CODE_RUNNER_FUNCTION: !Ref RunnerFunctionName
          CODE_RUNNER_TENANT_ISOLATION: "off"
      Events:
        SubmitInterviewAnswer:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /interviews/{interviewId}/answers
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer
        OptionsInterviewAnswers:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /interviews/{interviewId}/answers
            Method: OPTIONS
            Auth:
              Authorizer: NONE
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref InterviewsTable
        - DynamoDBReadPolicy:
            TableName: Submissions
        # Converse needs bedrock:InvokeModel on these models, in us-east-1 only (the Host model, and the checker and writer of host.v5).
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - !Sub "arn:aws:bedrock:us-east-1::foundation-model/${AgentModelId}"
                - !Sub "arn:aws:bedrock:us-east-1::foundation-model/${AgentCheckerModelId}"
                - !Sub "arn:aws:bedrock:us-east-1::foundation-model/${AgentWriterModelId}"
        - DynamoDBCrudPolicy:
            TableName: !Ref RunUsageTable
        - Statement:
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource:
                - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${RunnerFunctionName}"

  # ------------------------------------------
  # LAMBDA: Get Interview
  # ------------------------------------------
  GetInterviewFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/interviews/get/
      Handler: index.handler
      Description: Gets an interview transcript (students without reasons, admins everything)
      Events:
        GetInterview:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /interviews/{interviewId}
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer
        OptionsInterviewId:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /interviews/{interviewId}
            Method: OPTIONS
            Auth:
              Authorizer: NONE
      Policies:
        # Read, plus the timed_out update when the deadline has passed.
        - DynamoDBCrudPolicy:
            TableName: !Ref InterviewsTable
        - DynamoDBReadPolicy:
            TableName: Users
        # The admin view includes the submitted code.
        - DynamoDBReadPolicy:
            TableName: Submissions

  # ------------------------------------------
  # LAMBDA: List the interviews of one submission (admin)
  # ------------------------------------------
  ListSubmissionInterviewsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/interviews/list/
      Handler: index.handler
      Description: Lists the interviews (real and practice) of one submission, admin only
      Events:
        ListSubmissionInterviews:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /interviews
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref InterviewsTable
        - DynamoDBReadPolicy:
            TableName: Users

  # ------------------------------------------
  # LAMBDA: Start a practice interview (admin)
  # ------------------------------------------
  StartPracticeInterviewFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/interviews/practice/
      Handler: index.handler
      Description: Starts a practice interview on an existing submission's code, admin only
      Timeout: 25
      Environment:
        Variables:
          # Create starts the prepare step (runs, code status, host.v7 analysis) as its own function, asynchronously
          PREPARE_INTERVIEW_FUNCTION: !Ref PrepareInterviewFunction
      Events:
        StartPracticeInterview:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /interviews/practice
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer
        OptionsInterviewsPractice:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /interviews/practice
            Method: OPTIONS
            Auth:
              Authorizer: NONE
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref InterviewsTable
        - DynamoDBReadPolicy:
            TableName: Submissions
        - DynamoDBReadPolicy:
            TableName: Milestones
        - DynamoDBReadPolicy:
            TableName: Users
        - Statement:
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource:
                - !GetAtt PrepareInterviewFunction.Arn

  # ------------------------------------------
  # LAMBDA: Save the instructor's review of an interview (admin)
  # ------------------------------------------
  SaveInterviewReviewFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/interviews/review/
      Handler: index.handler
      Description: Saves the instructor's overrides, grade and note for an interview, admin only
      Events:
        SaveInterviewReview:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /interviews/{interviewId}/review
            Method: PUT
            Auth:
              Authorizer: CognitoAuthorizer
        OptionsInterviewReview:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /interviews/{interviewId}/review
            Method: OPTIONS
            Auth:
              Authorizer: NONE
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref InterviewsTable
        - DynamoDBReadPolicy:
            TableName: Users

  # ==========================================
  # DYNAMODB TABLES
  # ==========================================

  # ------------------------------------------
  # TABLE: Interviews (per environment, unlike the older shared tables)
  # ------------------------------------------
  InterviewsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "Interviews-${Environment}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: interviewId
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: submissionId
          AttributeType: S
      KeySchema:
        - AttributeName: interviewId
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        # Only META items carry submissionId, so this index holds one item per interview.
        - IndexName: SubmissionIdIndex
          KeySchema:
            - AttributeName: submissionId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      # Retention period: set InterviewRetentionDays to stamp expiresAt on every item.
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  # ------------------------------------------
  # TABLE: Users
  # ------------------------------------------
  UsersTable:
    Type: AWS::DynamoDB::Table
    Condition: CreateTables
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: Users
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH

  # ------------------------------------------
  # TABLE: Credentials
  # ------------------------------------------
  CredentialsTable:
    Type: AWS::DynamoDB::Table
    Condition: CreateTables
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: Credentials
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: credentialId
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
        - AttributeName: submissionId
          AttributeType: S
      KeySchema:
        - AttributeName: credentialId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: UserIdIndex
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: SubmissionIdIndex
          KeySchema:
            - AttributeName: submissionId
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  # ------------------------------------------
  # TABLE: Milestones
  # ------------------------------------------
  MilestonesTable:
    Type: AWS::DynamoDB::Table
    Condition: CreateTables
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: Milestones
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: milestoneId
          AttributeType: S
      KeySchema:
        - AttributeName: milestoneId
          KeyType: HASH

  # ------------------------------------------
  # TABLE: TestCases
  # ------------------------------------------
  TestCasesTable:
    Type: AWS::DynamoDB::Table
    Condition: CreateTables
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: TestCases
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: testCaseId
          AttributeType: S
        - AttributeName: milestoneId
          AttributeType: S
      KeySchema:
        - AttributeName: testCaseId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: MilestoneIdIndex
          KeySchema:
            - AttributeName: milestoneId
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  # ------------------------------------------
  # TABLE: Submissions
  # ------------------------------------------
  SubmissionsTable:
    Type: AWS::DynamoDB::Table
    Condition: CreateTables
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: Submissions
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: submissionId
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
        - AttributeName: milestoneId
          AttributeType: S
        - AttributeName: userMilestoneKey
          AttributeType: S
      KeySchema:
        - AttributeName: submissionId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: UserIdIndex
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: MilestoneIdIndex
          KeySchema:
            - AttributeName: milestoneId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: UserMilestoneIndex
          KeySchema:
            - AttributeName: userMilestoneKey
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  # ------------------------------------------
  # TABLE: RunUsage (counters for the Run limits; counts only, never code)
  # ------------------------------------------
  # pk = run#<user>#<assessment> | agent#<user>#<interview> | minute#<user>#<minute>. Only the per-minute counters carry
  # expiresAt, which the TTL below removes. Name includes the environment, so dev and production never share it.
  RunUsageTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "RunUsage-${Environment}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

# ==========================================
# OUTPUTS
# ==========================================
Outputs:
  Environment:
    Description: "Deployment environment"
    Value: !Ref Environment
  
  ApiEndpoint:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${MicroCredentialingAPI}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"
    Export:
      Name: !Sub "MicroCredentialingApiEndpoint-${Environment}"

  UsersTableName:
    Description: "DynamoDB Users Table"
    Value: Users

  CredentialsTableName:
    Description: "DynamoDB Credentials Table"
    Value: Credentials

  MilestonesTableName:
    Description: "DynamoDB Milestones Table"
    Value: Milestones

  TestCasesTableName:
    Description: "DynamoDB TestCases Table"
    Value: TestCases

  SubmissionsTableName:
    Description: "DynamoDB Submissions Table"
    Value: Submissions

  RunUsageTableName:
    Description: "DynamoDB table with the Run usage counters"
    Value: !Ref RunUsageTable

  SharedCodeLayerArn:
    Description: "ARN of the shared code layer"
    Value: !Ref SharedCodeLayer