            Auth:
              Authorizer: CognitoAuthorizer
        OptionsEmbeddedAssessmentId:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /embedded-assessments/{assessmentId}
            Method: OPTIONS
            Auth:
              Authorizer: NONE
      Policies:
        - DynamoDBReadPolicy:
            TableName: Milestones
        - DynamoDBReadPolicy:
