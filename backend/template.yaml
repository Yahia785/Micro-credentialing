              Authorizer: CognitoAuthorizer
        # OPTIONS - NO AUTH (allows CORS preflight)
        OptionsBatchTestCases:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /milestones/{milestoneId}/testcases/batch
            Method: OPTIONS
            Auth:
              Authorizer: NONE
      # Users read: withHandler({ requireAdmin: true }) looks up the caller's role.
      Policies:
        - DynamoDBReadPolicy:
            TableName: Users
        - DynamoDBCrudPolicy:
            TableName: TestCases
        - DynamoDBCrudPolicy:
            TableName: Milestones

  # ------------------------------------------
  # LAMBDA: Get Test Cases
  # ------------------------------------------
  GetTestCasesFunction:
