  # ------------------------------------------
  # LAMBDA: Submit Embedded Assessment
  # ------------------------------------------
  SubmitEmbeddedAssessmentFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/embedded-assessments/submit/
      Handler: index.handler
