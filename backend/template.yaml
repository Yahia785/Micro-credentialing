AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Micro-Credentialing Platform Backend

# ==========================================
# PARAMETERS
# ==========================================
Parameters:
  CognitoUserPoolId:
    Type: String
    Description: Cognito User Pool ID from Amplify
    Default: "us-east-1_CkcMQmOst"

# ==========================================
# GLOBALS
# ==========================================
Globals:
  Function:
    Runtime: nodejs18.x
    Timeout: 30
    MemorySize: 256
    Layers:
      - !Ref SharedCodeLayer
    Environment:
      Variables:
        USERS_TABLE: !Ref UsersTable
        CREDENTIALS_TABLE: !Ref CredentialsTable
        MILESTONES_TABLE: !Ref MilestonesTable
        COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId

# ==========================================
# RESOURCES
# ==========================================
Resources:

  # ------------------------------------------
  # LAMBDA LAYER: Shared Code
  # ------------------------------------------
  SharedCodeLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: micro-credentialing-shared
      Description: Shared database functions, utilities, and middleware
      ContentUri: shared/
      CompatibleRuntimes:
        - nodejs18.x

  # ------------------------------------------
  # API GATEWAY
  # ------------------------------------------
  MicroCredentialingAPI:
    Type: AWS::Serverless::Api
    Properties:
      StageName: dev
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            Type: COGNITO_USER_POOLS
            UserPoolArn: !Sub "arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${CognitoUserPoolId}"

  # ==========================================
  # USER MANAGEMENT FUNCTIONS
  # ==========================================

  # ------------------------------------------
  # LAMBDA: Create User
  # ------------------------------------------
  CreateUserFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/users/create/
      Handler: index.handler
      Description: Creates user profile in DynamoDB
      Events:
        CreateUser:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /users
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable

  # ------------------------------------------
  # LAMBDA: Get User
  # ------------------------------------------
  GetUserFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/users/get/
      Handler: index.handler
      Description: Gets user profile from DynamoDB
      Events:
        GetUser:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /users/{userId}
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer
        GetCurrentUser:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /users/me
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable

  # ------------------------------------------
  # LAMBDA: Update User (Name only)
  # ------------------------------------------
  UpdateUserFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/users/update/
      Handler: index.handler
      Description: Updates user profile name in DynamoDB
      Events:
        UpdateUser:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /users/{userId}
            Method: PUT
            Auth:
              Authorizer: CognitoAuthorizer
        UpdateCurrentUser:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /users/me
            Method: PUT
            Auth:
              Authorizer: CognitoAuthorizer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable

  # ------------------------------------------
  # LAMBDA: Initiate Email Change
  # ------------------------------------------
  InitiateEmailChangeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/users/initiate-email-change/
      Handler: index.handler
      Description: Initiates email change by confirming pending email
      Events:
        InitiateEmailChange:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /users/initiate-email-change
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer
      Policies: []

  # ------------------------------------------
  # LAMBDA: Verify Email Change
  # ------------------------------------------
  VerifyEmailChangeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/users/verify-email-change/
      Handler: index.handler
      Description: Completes email change by updating DynamoDB
      Events:
        VerifyEmailChange:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /users/verify-email-change
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable

  # ==========================================
  # MILESTONE (PROBLEM) MANAGEMENT FUNCTIONS
  # ==========================================

  # ------------------------------------------
  # LAMBDA: Create Milestone
  # ------------------------------------------
  CreateMilestoneFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/milestones/create/
      Handler: index.handler
      Description: Creates a milestone (problem) in DynamoDB
      Events:
        CreateMilestone:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /milestones
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MilestonesTable

  # ------------------------------------------
  # LAMBDA: Get Milestone(s)
  # ------------------------------------------
  GetMilestoneFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/milestones/get/
      Handler: index.handler
      Description: Gets milestone(s) from DynamoDB
      Events:
        GetAllMilestones:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /milestones
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer
        GetMilestone:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /milestones/{milestoneId}
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref MilestonesTable

  # ------------------------------------------
  # LAMBDA: Update Milestone
  # ------------------------------------------
  UpdateMilestoneFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/milestones/update/
      Handler: index.handler
      Description: Updates a milestone (problem) in DynamoDB
      Events:
        UpdateMilestone:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /milestones/{milestoneId}
            Method: PUT
            Auth:
              Authorizer: CognitoAuthorizer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MilestonesTable

  # ------------------------------------------
  # LAMBDA: Delete Milestone
  # ------------------------------------------
  DeleteMilestoneFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/milestones/delete/
      Handler: index.handler
      Description: Deletes a milestone (problem) from DynamoDB
      Events:
        DeleteMilestone:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /milestones/{milestoneId}
            Method: DELETE
            Auth:
              Authorizer: CognitoAuthorizer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MilestonesTable

  # ==========================================
  # DYNAMODB TABLES
  # ==========================================

  # ------------------------------------------
  # TABLE: Users
  # ------------------------------------------
  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Users
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH

  # ------------------------------------------
  # TABLE: Credentials
  # ------------------------------------------
  CredentialsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Credentials
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: credentialId
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: credentialId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: UserIdIndex
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  # ------------------------------------------
  # TABLE: Milestones
  # ------------------------------------------
  MilestonesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Milestones
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: milestoneId
          AttributeType: S
      KeySchema:
        - AttributeName: milestoneId
          KeyType: HASH

# ==========================================
# OUTPUTS
# ==========================================
Outputs:
  ApiEndpoint:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${MicroCredentialingAPI}.execute-api.${AWS::Region}.amazonaws.com/dev"
    Export:
      Name: MicroCredentialingApiEndpoint

  UsersTableName:
    Description: "DynamoDB Users Table"
    Value: !Ref UsersTable

  CredentialsTableName:
    Description: "DynamoDB Credentials Table"
    Value: !Ref CredentialsTable

  MilestonesTableName:
    Description: "DynamoDB Milestones Table"
    Value: !Ref MilestonesTable

  SharedCodeLayerArn:
    Description: "ARN of the shared code layer"
    Value: !Ref SharedCodeLayer