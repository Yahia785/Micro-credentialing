            RestApiId: !Ref MicroCredentialingAPI
            Path: /credentials/get-pending-reviews
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer
        # OPTIONS - NO AUTH (allows CORS preflight)
        OptionsPendingReviews:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /credentials/get-pending-reviews
            Method: OPTIONS
