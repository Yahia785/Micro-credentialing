  # ------------------------------------------
  # LAMBDA: Update Embedded Assessment
  # ------------------------------------------
  UpdateEmbeddedAssessmentFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/embedded-assessments/update/
      Handler: index.handler
      Description: Updates an embedded assessment
      Events:
