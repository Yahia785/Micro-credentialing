  # ==========================================
  # EMBEDDED ASSESSMENT FUNCTIONS
  # ==========================================

  # ------------------------------------------
  # LAMBDA: Create Embedded Assessment
  # ------------------------------------------
  CreateEmbeddedAssessmentFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/embedded-assessments/create/
      Handler: index.handler
      Description: Creates an embedded systems assessment with rubric
      Events:
        CreateEmbeddedAssessment:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /embedded-assessments
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer
        OptionsEmbeddedAssessments:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /embedded-assessments
            Method: OPTIONS
            Auth:
              Authorizer: NONE
      Policies:
        - DynamoDBCrudPolicy:
            TableName: Milestones
        - DynamoDBReadPolicy:
            TableName: Users

  # ------------------------------------------
  # LAMBDA: Get Embedded Assessment(s)
  # ------------------------------------------
  GetEmbeddedAssessmentsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/embedded-assessments/get/
      Handler: index.handler
      Description: Gets embedded assessments
      Events:
        GetAllEmbeddedAssessments:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /embedded-assessments
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer
        GetEmbeddedAssessment:
          Type: Api
          Properties:
