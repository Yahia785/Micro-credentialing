AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Micro-Credentialing Platform Backend

# ==========================================
# PARAMETERS
# ==========================================
Parameters:
  Environment:
    Type: String
    Default: "dev"
    AllowedValues:
      - dev
      - production
    Description: Deployment environment (dev or production)
  
  CognitoUserPoolId:
    Type: String
    Description: Cognito User Pool ID from Amplify
    Default: "us-east-1_CkcMQmOst"

  BCDiplomaApiKeySecretName:
    Type: String
    Description: Name of the BCdiploma API Key secret in Secrets Manager
    Default: "micro-credentialing/bcdiploma-api-key"
  
  BCDiplomaIssuerIdSecretName:
    Type: String
    Description: Name of the BCdiploma Issuer ID secret in Secrets Manager
    Default: "micro-credentialing/bcdiploma-issuer-id"

  AnthropicApiKeySecretName:
    Type: String
    Description: Name of the Anthropic API Key secret in Secrets Manager
    Default: "micro-credentialing/anthropic-api-key"

  # NOTE: Create this secret before deploying:
  # aws secretsmanager create-secret --name micro-credentialing/judge0-api-key --secret-string "YOUR_JUDGE0_KEY"
  Judge0ApiKeySecretName:
    Type: String
    Description: Name of the Judge0 API Key secret in Secrets Manager
    Default: "micro-credentialing/judge0-api-key"

  # Which code runner grades C++ submissions. judge0 (default) = Judge0; own = the C++ runner Lambda (backend/runner).
  CodeRunner:
    Type: String
    Default: judge0
    AllowedValues:
      - judge0
      - own
    Description: Code runner provider for C++ grading (judge0 or own)

  # Name of the deployed runner function (backend/runner stack). Only used when CodeRunner is own.
  RunnerFunctionName:
    Type: String
    Default: micro-credentialing-runner-dev-recycle
    Description: Name of the C++ runner Lambda function (used when CodeRunner is own)

  EmbeddedGradingMode:
    Type: String
    Default: "manual"
    AllowedValues:
      - llm
      - manual
    Description: >-
      How embedded assessment submissions are graded. "manual" saves the submission for
      instructor review and never calls the Anthropic API; "llm" grades against the rubric
      with the LLM first.

  # Interview agent (Amazon Bedrock). Must be a direct model ID: cross-region inference
  # profiles ("us.", "eu.", "global." or an ARN) are refused by the code and not covered by IAM.
  AgentModelId:
    Type: String
    Default: "qwen.qwen3-coder-30b-a3b-v1:0"
    Description: >-
      Bedrock model ID used by the interview Host agent (Qwen3 Coder 30B A3B Instruct).
      Called directly in us-east-1 only.

  # Split Host agent (host.v5): step A checks the answer against the rubric, step B writes the follow-up. Used only when the
  # interview prompt version is host.v5. Direct open-weight model IDs, called in us-east-1 only.
  AgentCheckerModelId:
    Type: String
    Default: "deepseek.v3.2"
    Description: Bedrock model ID for step A (the rubric check) of host.v5 (DeepSeek v3.2). Called directly in us-east-1 only.
  AgentWriterModelId:
    Type: String
    Default: "deepseek.v3.2"
    Description: Bedrock model ID for step B (the follow-up question) of host.v5 (DeepSeek v3.2). Called directly in us-east-1 only.

  InterviewRetentionDays:
    Type: Number
    Default: 0
    MinValue: 0
    Description: >-
      Days to keep interview records before DynamoDB TTL deletes them (the expiresAt attribute).
      0 keeps them until deleted by hand.

  AllowedOrigins:
    Type: String
    Description: >-
      Comma-separated list of frontend origins allowed to call this API (CORS).
      Must be set explicitly per environment in samconfig-<env>.toml — no default,
      so a deploy with a missing value fails instead of silently reusing another
      environment's origins.

  PrimaryOrigin:
    Type: String
    Description: >-
      Single origin used for API Gateway's static CORS config (the Api resource's
      Cors.AllowOrigin) and for GatewayResponses (DEFAULT_4XX/5XX), which can only
      echo one fixed value. Should be this environment's main frontend origin and
      normally also be included in AllowedOrigins. Must be set explicitly per
      environment in samconfig-<env>.toml.

# ==========================================
# CONDITIONS
# ==========================================
Conditions:
  CreateTables: !Equals [!Ref Environment, "dev"]  

# ==========================================
# GLOBALS
# ==========================================
Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 90
    MemorySize: 256
    Layers:
      - !Ref SharedCodeLayer
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        USERS_TABLE: Users
        CREDENTIALS_TABLE: Credentials
        MILESTONES_TABLE: Milestones
        TESTCASES_TABLE: TestCases
        SUBMISSIONS_TABLE: Submissions
        INTERVIEWS_TABLE: !Sub "Interviews-${Environment}"
        AGENT_MODEL_ID: !Ref AgentModelId
        AGENT_CHECKER_MODEL_ID: !Ref AgentCheckerModelId
        AGENT_WRITER_MODEL_ID: !Ref AgentWriterModelId
        INTERVIEW_RETENTION_DAYS: !Ref InterviewRetentionDays
        RUN_USAGE_TABLE: !Sub "RunUsage-${Environment}"
        COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
        JUDGE0_API_KEY_SECRET_ARN: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${Judge0ApiKeySecretName}"
        JUDGE0_API_HOST: "judge0-ce.p.rapidapi.com"
        PROCTORING_BUCKET_NAME: "micro-credentialing-recordings"
        BCDIPLOMA_API_KEY_SECRET_ARN: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${BCDiplomaApiKeySecretName}"
        BCDIPLOMA_ISSUER_ID_SECRET_ARN: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${BCDiplomaIssuerIdSecretName}"
        BCDIPLOMA_API_URL: "https://api-staging.bcdiploma.com"
        ALLOWED_DOMAINS: "canvas.instructure.com,ti.com,dev.ti.com,onlinegdb.com,virginia.edu"
        FORBIDDEN_DOMAINS: "chatgpt.com,openai.com,claude.ai,anthropic.com,google.com/search,stackoverflow.com,discord.com,whatsapp.com,github.com/copilot"
        ANTHROPIC_API_KEY_SECRET_ARN: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${AnthropicApiKeySecretName}"
        ALLOWED_ORIGINS: !Ref AllowedOrigins
        ADMIN_EMAILS: "yahiatawfeek20@gmail.com"

# ==========================================
# RESOURCES
# ==========================================
Resources:

  # ------------------------------------------
  # LAMBDA LAYER: Shared Code
  # ------------------------------------------
  SharedCodeLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: micro-credentialing-shared
      Description: Shared database functions, utilities, and middleware
      ContentUri: shared/
      CompatibleRuntimes:
        - nodejs22.x

  # ------------------------------------------
  # API GATEWAY
  # ------------------------------------------
  MicroCredentialingAPI:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Environment
      Cors:
        AllowOrigin: !Sub "'${PrimaryOrigin}'"
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            Type: COGNITO_USER_POOLS
            UserPoolArn: !Sub "arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${CognitoUserPoolId}"

  # All active API paths have an explicit Lambda-backed OPTIONS event (see functions
  # below), so this static Cors config is never used to answer real preflight requests.
  # It only exists to give API Gateway a concrete value to validate against.
  #
  # A 401 from the Cognito authorizer never reaches a Lambda, so it can't get its CORS
  # header from cors-middleware.js — it needs a GatewayResponse. GatewayResponses can
  # only echo one static origin (not "whichever one the browser sent"), so this uses
  # PrimaryOrigin. In dev, a request from the other allowed origin (e.g. localhost)
  # would see a 401 blocked by CORS instead of a clean 401 — a narrow, low-severity gap.
  ApiGatewayDefault4xx:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      ResponseType: DEFAULT_4XX
      RestApiId: !Ref MicroCredentialingAPI
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: !Sub "'${PrimaryOrigin}'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"

  ApiGatewayDefault5xx:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      ResponseType: DEFAULT_5XX
      RestApiId: !Ref MicroCredentialingAPI
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: !Sub "'${PrimaryOrigin}'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
  # ==========================================
  # USER MANAGEMENT FUNCTIONS
  # ==========================================

  # ------------------------------------------
  # LAMBDA: Create User
  # ------------------------------------------
  CreateUserFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/users/create/
      Handler: index.handler
      Description: Creates user profile in DynamoDB
      Events:
        CreateUser:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /users
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer
        # OPTIONS - NO AUTH (allows CORS preflight)
        OptionsUsers:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /users
            Method: OPTIONS
            Auth:
              Authorizer: NONE
      Policies:
        - DynamoDBCrudPolicy:
            TableName: Users

  # ------------------------------------------
  # LAMBDA: Get User
  # ------------------------------------------
  GetUserFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/users/get/
      Handler: index.handler
      Description: Gets user profile from DynamoDB
      Events:
        GetUser:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /users/{userId}
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer
        GetCurrentUser:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /users/me
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer
        # OPTIONS - NO AUTH (allows CORS preflight)
        OptionsUserId:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /users/{userId}
            Method: OPTIONS
            Auth:
              Authorizer: NONE
        OptionsUserMe:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /users/me
            Method: OPTIONS
            Auth:
              Authorizer: NONE
      Policies:
        - DynamoDBReadPolicy:
            TableName: Users

 # ------------------------------------------
  # LAMBDA: Update User (Name only)
  # ------------------------------------------
  UpdateUserFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/users/update/
      Handler: index.handler
      Description: Updates user profile name in DynamoDB
      Events:
        UpdateUser:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /users/{userId}
            Method: PUT
            Auth:
              Authorizer: CognitoAuthorizer
        UpdateCurrentUser:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /users/me
            Method: PUT
            Auth:
              Authorizer: CognitoAuthorizer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: Users

  # ------------------------------------------
  # LAMBDA: Initiate Email Change
  # ------------------------------------------
  InitiateEmailChangeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/users/initiate-email-change/
      Handler: index.handler
      Description: Initiates email change by confirming pending email
      Events:
        InitiateEmailChange:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /users/initiate-email-change
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer
        # OPTIONS - NO AUTH (allows CORS preflight)
        OptionsInitiateEmailChange:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /users/initiate-email-change
            Method: OPTIONS
            Auth:
              Authorizer: NONE
      Policies: []

  # ------------------------------------------
  # LAMBDA: Verify Email Change
  # ------------------------------------------
  VerifyEmailChangeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/users/verify-email-change/
      Handler: index.handler
      Description: Completes email change by updating DynamoDB
      Events:
        VerifyEmailChange:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /users/verify-email-change
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer
        # OPTIONS - NO AUTH (allows CORS preflight)
        OptionsVerifyEmailChange:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /users/verify-email-change
            Method: OPTIONS
            Auth:
              Authorizer: NONE
      Policies:
        - DynamoDBCrudPolicy:
            TableName: Users

  # ==========================================
  # MILESTONE (PROBLEM) MANAGEMENT FUNCTIONS
  # ==========================================

  # ------------------------------------------
  # LAMBDA: Create Milestone
  # ------------------------------------------
  CreateMilestoneFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/milestones/create/
      Handler: index.handler
      Description: Creates a milestone (problem) in DynamoDB
      Events:
        CreateMilestone:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /milestones
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer
      # Users read: withHandler({ requireAdmin: true }) looks up the caller's role.
      Policies:
        - DynamoDBReadPolicy:
            TableName: Users
        - DynamoDBCrudPolicy:
            TableName: Milestones

  # ------------------------------------------
  # LAMBDA: Get Milestone(s)
  # ------------------------------------------
  GetMilestoneFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/milestones/get/
      Handler: index.handler
      Description: Gets milestone(s) from DynamoDB
      Events:
        GetAllMilestones:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /milestones
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer
        GetMilestone:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /milestones/{milestoneId}
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer
        # OPTIONS - NO AUTH (allows CORS preflight)
        OptionsMilestones:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /milestones
            Method: OPTIONS
            Auth:
              Authorizer: NONE
        OptionsMilestoneId:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /milestones/{milestoneId}
            Method: OPTIONS
            Auth:
              Authorizer: NONE
      # Users read: the list hides isHidden problems from everyone but admins (role lookup).
      Policies:
        - DynamoDBReadPolicy:
            TableName: Milestones
        - DynamoDBReadPolicy:
            TableName: Users

  # ------------------------------------------
  # LAMBDA: Update Milestone
  # ------------------------------------------
  UpdateMilestoneFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/milestones/update/
      Handler: index.handler
      Description: Updates a milestone (problem) in DynamoDB
      Events:
        UpdateMilestone:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /milestones/{milestoneId}
            Method: PUT
            Auth:
              Authorizer: CognitoAuthorizer
      # Users read: withHandler({ requireAdmin: true }) looks up the caller's role.
      Policies:
        - DynamoDBReadPolicy:
            TableName: Users
        - DynamoDBCrudPolicy:
            TableName: Milestones

  # ------------------------------------------
  # LAMBDA: Delete Milestone
  # ------------------------------------------
  DeleteMilestoneFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/milestones/delete/
      Handler: index.handler
      Description: Deletes a milestone (problem) from DynamoDB
      Events:
        DeleteMilestone:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /milestones/{milestoneId}
            Method: DELETE
            Auth:
              Authorizer: CognitoAuthorizer
      # Users read: withHandler({ requireAdmin: true }) looks up the caller's role.
      # TestCases + Submissions: deleteMilestoneWithCleanup() queries and batch-deletes both tables.
      Policies:
        - DynamoDBReadPolicy:
            TableName: Users
        - DynamoDBCrudPolicy:
            TableName: TestCases
        - DynamoDBCrudPolicy:
            TableName: Submissions
        - DynamoDBCrudPolicy:
            TableName: Milestones



