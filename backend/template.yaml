            Path: /credentials/get-recording-urls/{submissionId}
            Method: OPTIONS
            Auth:
              Authorizer: NONE
      Policies:
        - DynamoDBReadPolicy:
            TableName: Submissions
        - DynamoDBReadPolicy:
            TableName: Users
        - S3ReadPolicy:
            BucketName: micro-credentialing-recordings


  # ------------------------------------------
  # LAMBDA: BCdiploma Webhook Handler (NEW - WEEK 3)
  # ------------------------------------------
  BCdiplomaWebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/webhooks/bcdiploma-notification/
      Handler: index.handler
      Description: Receives BCdiploma webhook notifications when certificates are ready
      Timeout: 60
      Events:
        WebhookGet:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /webhooks/bcdiploma-notification
