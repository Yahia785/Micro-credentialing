              Authorizer: NONE
      Policies:
        - DynamoDBReadPolicy:
            TableName: Submissions
        - DynamoDBReadPolicy:
            TableName: Users
        - DynamoDBReadPolicy:
            TableName: Milestones

  # ------------------------------------------
  # LAMBDA: Approve Review (UPDATED - Now uses webhook)
  # ------------------------------------------
  ApproveReviewFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/credentials/approve-review/
      Handler: index.handler
      Description: Approve proctoring review and push to BCdiploma (webhook completes process)
      Timeout: 30  # Reduced from 120 since we don't wait anymore!
      Events:
        ApproveReview:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /credentials/approve-review
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer
        # OPTIONS - NO AUTH (allows CORS preflight)
        OptionsApproveReview:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /credentials/approve-review
            Method: OPTIONS
            Auth:
              Authorizer: NONE
      # Users read+write: updateUser() stores the review status on the student's completedMilestones entry.
      # (Was read-only, so that update was denied and silently skipped.)
      Policies:
        - DynamoDBCrudPolicy:
            TableName: Submissions
        - DynamoDBCrudPolicy:
            TableName: Users
        - DynamoDBReadPolicy:
            TableName: Milestones
        - DynamoDBCrudPolicy:  
            TableName: Credentials
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${BCDiplomaApiKeySecretName}*"
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${BCDiplomaIssuerIdSecretName}*"

  # ------------------------------------------
