AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Micro-Credentialing Platform Backend

# ==========================================
# PARAMETERS
# ==========================================
Parameters:
  CognitoUserPoolId:
    Type: String
    Description: Cognito User Pool ID from Amplify
    Default: "us-east-1_CkcMQmOst"

  BCDiplomaApiKeySecretName:
    Type: String
    Description: Name of the BCdiploma API Key secret in Secrets Manager
    Default: "micro-credentialing/bcdiploma-api-key"
  
  BCDiplomaIssuerIdSecretName:
    Type: String
    Description: Name of the BCdiploma Issuer ID secret in Secrets Manager
    Default: "micro-credentialing/bcdiploma-issuer-id"    

# ==========================================
# GLOBALS
# ==========================================
Globals:
  Function:
    Runtime: nodejs18.x
    Timeout: 90
    MemorySize: 256
    Layers:
      - !Ref SharedCodeLayer
    Environment:
      Variables:
        USERS_TABLE: !Ref UsersTable
        CREDENTIALS_TABLE: !Ref CredentialsTable
        MILESTONES_TABLE: !Ref MilestonesTable
        TESTCASES_TABLE: !Ref TestCasesTable
        SUBMISSIONS_TABLE: !Ref SubmissionsTable
        COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
        JUDGE0_API_KEY: "{{resolve:ssm:/micro-credentialing/judge0-api-key:1}}"
        JUDGE0_API_HOST: "judge0-ce.p.rapidapi.com"
        PROCTORING_BUCKET_NAME: "micro-credentialing-recordings"
        BCDIPLOMA_API_KEY_SECRET_ARN: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${BCDiplomaApiKeySecretName}"
        BCDIPLOMA_ISSUER_ID_SECRET_ARN: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${BCDiplomaIssuerIdSecretName}"
        BCDIPLOMA_API_URL: "https://api-staging.bcdiploma.com"
        

# ==========================================
# RESOURCES
# ==========================================
Resources:

  # ------------------------------------------
  # LAMBDA LAYER: Shared Code
  # ------------------------------------------
  SharedCodeLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: micro-credentialing-shared
      Description: Shared database functions, utilities, and middleware
      ContentUri: shared/
      CompatibleRuntimes:
        - nodejs18.x

  # ------------------------------------------
  # API GATEWAY
  # ------------------------------------------
  MicroCredentialingAPI:
    Type: AWS::Serverless::Api
    Properties:
      StageName: dev
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            Type: COGNITO_USER_POOLS
            UserPoolArn: !Sub "arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${CognitoUserPoolId}"

  # ==========================================
  # USER MANAGEMENT FUNCTIONS
  # ==========================================

  # ------------------------------------------
  # LAMBDA: Create User
  # ------------------------------------------
  CreateUserFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/users/create/
      Handler: index.handler
      Description: Creates user profile in DynamoDB
      Events:
        CreateUser:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /users
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable

  # ------------------------------------------
  # LAMBDA: Get User
  # ------------------------------------------
  GetUserFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/users/get/
      Handler: index.handler
      Description: Gets user profile from DynamoDB
      Events:
        GetUser:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /users/{userId}
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer
        GetCurrentUser:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /users/me
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable

  # ------------------------------------------
  # LAMBDA: Update User (Name only)
  # ------------------------------------------
  UpdateUserFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/users/update/
      Handler: index.handler
      Description: Updates user profile name in DynamoDB
      Events:
        UpdateUser:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /users/{userId}
            Method: PUT
            Auth:
              Authorizer: CognitoAuthorizer
        UpdateCurrentUser:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /users/me
            Method: PUT
            Auth:
              Authorizer: CognitoAuthorizer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable

  # ------------------------------------------
  # LAMBDA: Initiate Email Change
  # ------------------------------------------
  InitiateEmailChangeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/users/initiate-email-change/
      Handler: index.handler
      Description: Initiates email change by confirming pending email
      Events:
        InitiateEmailChange:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /users/initiate-email-change
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer
      Policies: []

  # ------------------------------------------
  # LAMBDA: Verify Email Change
  # ------------------------------------------
  VerifyEmailChangeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/users/verify-email-change/
      Handler: index.handler
      Description: Completes email change by updating DynamoDB
      Events:
        VerifyEmailChange:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /users/verify-email-change
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable

  # ==========================================
  # MILESTONE (PROBLEM) MANAGEMENT FUNCTIONS
  # ==========================================

  # ------------------------------------------
  # LAMBDA: Create Milestone
  # ------------------------------------------
  CreateMilestoneFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/milestones/create/
      Handler: index.handler
      Description: Creates a milestone (problem) in DynamoDB
      Events:
        CreateMilestone:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /milestones
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MilestonesTable

  # ------------------------------------------
  # LAMBDA: Get Milestone(s)
  # ------------------------------------------
  GetMilestoneFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/milestones/get/
      Handler: index.handler
      Description: Gets milestone(s) from DynamoDB
      Events:
        GetAllMilestones:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /milestones
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer
        GetMilestone:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /milestones/{milestoneId}
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref MilestonesTable

  # ------------------------------------------
  # LAMBDA: Update Milestone
  # ------------------------------------------
  UpdateMilestoneFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/milestones/update/
      Handler: index.handler
      Description: Updates a milestone (problem) in DynamoDB
      Events:
        UpdateMilestone:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /milestones/{milestoneId}
            Method: PUT
            Auth:
              Authorizer: CognitoAuthorizer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MilestonesTable

  # ------------------------------------------
  # LAMBDA: Delete Milestone
  # ------------------------------------------
  DeleteMilestoneFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/milestones/delete/
      Handler: index.handler
      Description: Deletes a milestone (problem) from DynamoDB
      Events:
        DeleteMilestone:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /milestones/{milestoneId}
            Method: DELETE
            Auth:
              Authorizer: CognitoAuthorizer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MilestonesTable

  # ==========================================
  # TEST CASES MANAGEMENT FUNCTIONS
  # ==========================================

  # ------------------------------------------
  # LAMBDA: Batch Create Test Cases
  # ------------------------------------------
  BatchCreateTestCasesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/testcases/batch-create/
      Handler: index.handler
      Description: Batch create test cases for a milestone
      Events:
        BatchCreateTestCases:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /milestones/{milestoneId}/testcases/batch
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TestCasesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref MilestonesTable

  # ------------------------------------------
  # LAMBDA: Get Test Cases
  # ------------------------------------------
  GetTestCasesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/testcases/get/
      Handler: index.handler
      Description: Get test cases for a milestone
      Events:
        GetTestCases:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /milestones/{milestoneId}/testcases
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref TestCasesTable
        - DynamoDBReadPolicy:
            TableName: !Ref MilestonesTable
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable

  # ==========================================
  # SUBMISSIONS FUNCTIONS
  # ==========================================

  # ------------------------------------------
  # LAMBDA: Create Submission (Submit Code)
  # ------------------------------------------
  CreateSubmissionFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/submissions/create/
      Handler: index.handler
      Description: Submit code for grading with Judge0
      Timeout: 90
      Events:
        SubmitCode:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /submissions/submit
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SubmissionsTable
        - DynamoDBReadPolicy:
            TableName: !Ref TestCasesTable
        - DynamoDBReadPolicy:
            TableName: !Ref MilestonesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable

  # ------------------------------------------
  # LAMBDA: Get Submission
  # ------------------------------------------
  GetSubmissionFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/submissions/get/
      Handler: index.handler
      Description: Get a submission by ID
      Events:
        GetSubmission:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /submissions/{submissionId}
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref SubmissionsTable

  # ==========================================
  # PROCTORING FUNCTIONS
  # ==========================================

  # ------------------------------------------
  # LAMBDA: Generate Presigned Upload URLs
  # ------------------------------------------
  GenerateUploadUrlsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/proctoring/generate-upload-urls/
      Handler: index.handler
      Description: Generate presigned S3 URLs for proctoring recording uploads
      Events:
        GenerateUrls:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /proctoring/upload-urls
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer
      Policies:
        - S3CrudPolicy:
            BucketName: micro-credentialing-recordings

  # ------------------------------------------
  # LAMBDA: Save Recording Metadata
  # ------------------------------------------
  SaveRecordingMetadataFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/proctoring/save-recording-metadata/
      Handler: index.handler
      Description: Save proctoring recording metadata to DynamoDB
      Events:
        SaveMetadata:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /proctoring/recording-metadata
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SubmissionsTable

  # ==========================================
  # CREDENTIAL MANAGEMENT FUNCTIONS
  # ==========================================

  # ------------------------------------------
  # LAMBDA: Get User Credentials
  # ------------------------------------------
  GetUserCredentialsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/credentials/get-user-credentials/
      Handler: index.handler
      Description: Get all credentials for the current user
      Events:
        GetCredentials:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /credentials
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref CredentialsTable

  # ------------------------------------------
  # LAMBDA: Get Single Credential
  # ------------------------------------------
  GetCredentialFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/credentials/get-credential/
      Handler: index.handler
      Description: Get a single credential by ID
      Events:
        GetCredential:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /credentials/{credentialId}
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref CredentialsTable

  # ------------------------------------------
  # LAMBDA: Get Pending Reviews
  # ------------------------------------------
  GetPendingReviewsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/credentials/get-pending-reviews/
      Handler: index.handler
      Description: Get submissions pending proctoring review (admin only)
      Events:
        GetPendingReviews:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /credentials/get-pending-reviews
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref SubmissionsTable
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
        - DynamoDBReadPolicy:
            TableName: !Ref MilestonesTable

  # ------------------------------------------
  # LAMBDA: Approve Review (UPDATED - Now uses webhook)
  # ------------------------------------------
  ApproveReviewFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/credentials/approve-review/
      Handler: index.handler
      Description: Approve proctoring review and push to BCdiploma (webhook completes process)
      Timeout: 30  # Reduced from 120 since we don't wait anymore!
      Events:
        ApproveReview:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /credentials/approve-review
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SubmissionsTable
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
        - DynamoDBReadPolicy:
            TableName: !Ref MilestonesTable
        - DynamoDBCrudPolicy:  
            TableName: !Ref CredentialsTable
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${BCDiplomaApiKeySecretName}*"
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${BCDiplomaIssuerIdSecretName}*"

  # ------------------------------------------
  # LAMBDA: Reject Review
  # ------------------------------------------
  RejectReviewFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/credentials/reject-review/
      Handler: index.handler
      Description: Reject proctoring review (admin only)
      Events:
        RejectReview:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /proctoring/reject-review
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SubmissionsTable
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable

  # ------------------------------------------
  # LAMBDA: Get Recording URLs
  # ------------------------------------------
  GetRecordingUrlsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/credentials/get-recording-urls/
      Handler: index.handler
      Description: Get presigned URLs for proctoring recordings (admin only)
      Events:
        GetRecordingUrls:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /credentials/get-recording-urls/{submissionId}
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref SubmissionsTable
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
        - S3ReadPolicy:
            BucketName: micro-credentialing-recordings


# ------------------------------------------
  # LAMBDA: BCdiploma Webhook Handler (NEW - WEEK 3)
  # ------------------------------------------
  BCdiplomaWebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/webhooks/bcdiploma-notification/
      Handler: index.handler
      Description: Receives BCdiploma webhook notifications when certificates are ready
      Timeout: 60
      Events:
        WebhookGet:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /webhooks/bcdiploma-notification
            Method: GET
            Auth:
              Authorizer: NONE  # Webhook doesn't use Cognito auth
        WebhookPost:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /webhooks/bcdiploma-notification
            Method: POST
            Auth:
              Authorizer: NONE  # Webhook doesn't use Cognito auth
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref SubmissionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SubmissionsTable
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
        - DynamoDBReadPolicy:
            TableName: !Ref MilestonesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref CredentialsTable
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${BCDiplomaApiKeySecretName}*"
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${BCDiplomaIssuerIdSecretName}*"
 
 # ------------------------------------------
  # LAMBDA: Configure BCdiploma Webhook (ONE-TIME SETUP)
  # ------------------------------------------
  ConfigureWebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/webhooks/configure-bcdiploma/
      Handler: index.handler
      Description: One-time function to configure BCdiploma webhook URL
      Timeout: 30
      Events:
        ConfigureWebhook:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /admin/configure-webhook
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${BCDiplomaApiKeySecretName}*"
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${BCDiplomaIssuerIdSecretName}*"
 
 
  # ==========================================
  # DYNAMODB TABLES
  # ==========================================

  # ------------------------------------------
  # TABLE: Users
  # ------------------------------------------
  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Users
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH

  # ------------------------------------------
  # TABLE: Credentials
  # ------------------------------------------
  CredentialsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Credentials
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: credentialId
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
        - AttributeName: submissionId
          AttributeType: S
      KeySchema:
        - AttributeName: credentialId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: UserIdIndex
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: SubmissionIdIndex
          KeySchema:
            - AttributeName: submissionId
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  # ------------------------------------------
  # TABLE: Milestones
  # ------------------------------------------
  MilestonesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Milestones
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: milestoneId
          AttributeType: S
      KeySchema:
        - AttributeName: milestoneId
          KeyType: HASH

  # ------------------------------------------
  # TABLE: TestCases
  # ------------------------------------------
  TestCasesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: TestCases
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: testCaseId
          AttributeType: S
        - AttributeName: milestoneId
          AttributeType: S
      KeySchema:
        - AttributeName: testCaseId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: MilestoneIdIndex
          KeySchema:
            - AttributeName: milestoneId
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  # ------------------------------------------
  # TABLE: Submissions
  # ------------------------------------------
  SubmissionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Submissions
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: submissionId
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
        - AttributeName: milestoneId
          AttributeType: S
        - AttributeName: userMilestoneKey
          AttributeType: S
      KeySchema:
        - AttributeName: submissionId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: UserIdIndex
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: MilestoneIdIndex
          KeySchema:
            - AttributeName: milestoneId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: UserMilestoneIndex
          KeySchema:
            - AttributeName: userMilestoneKey
              KeyType: HASH
          Projection:
            ProjectionType: ALL

# ==========================================
# OUTPUTS
# ==========================================
Outputs:
  ApiEndpoint:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${MicroCredentialingAPI}.execute-api.${AWS::Region}.amazonaws.com/dev"
    Export:
      Name: MicroCredentialingApiEndpoint

  UsersTableName:
    Description: "DynamoDB Users Table"
    Value: !Ref UsersTable

  CredentialsTableName:
    Description: "DynamoDB Credentials Table"
    Value: !Ref CredentialsTable

  MilestonesTableName:
    Description: "DynamoDB Milestones Table"
    Value: !Ref MilestonesTable

  TestCasesTableName:
    Description: "DynamoDB TestCases Table"
    Value: !Ref TestCasesTable

  SubmissionsTableName:
    Description: "DynamoDB Submissions Table"
    Value: !Ref SubmissionsTable

  SharedCodeLayerArn:
    Description: "ARN of the shared code layer"
    Value: !Ref SharedCodeLayer