  # ==========================================
  # SUBMISSIONS FUNCTIONS
  # ==========================================

  # ------------------------------------------
  # LAMBDA: Create Submission (Submit Code)
  # ------------------------------------------
  CreateSubmissionFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/submissions/create/
      Handler: index.handler
      Description: Submit code for grading (Judge0, or the own C++ runner when CodeRunner is own)
      Timeout: 90
      Environment:
        Variables:
          CODE_RUNNER: !Ref CodeRunner
          CODE_RUNNER_FUNCTION: !Ref RunnerFunctionName
          # The runner deployment has no Lambda tenant isolation (our account cannot use it), so no tenant id is sent.
          CODE_RUNNER_TENANT_ISOLATION: "off"
      Events:
        SubmitCode:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /submissions/submit
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer
        # OPTIONS - NO AUTH (allows CORS preflight)
        OptionsSubmit:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /submissions/submit
            Method: OPTIONS
            Auth:
              Authorizer: NONE
      Policies:
        - DynamoDBCrudPolicy:
            TableName: Submissions
        - DynamoDBReadPolicy:
            TableName: TestCases
        - DynamoDBReadPolicy:
            TableName: Milestones
        - DynamoDBCrudPolicy:
            TableName: Users
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${Judge0ApiKeySecretName}*"
        # Only this function (the one that grades C++) may invoke the runner, and only that function.
        - Statement:
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource:
                - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${RunnerFunctionName}"

  # ------------------------------------------
  # LAMBDA: Run Code (the Run button: custom input or visible sample tests, nothing is saved)
  # ------------------------------------------
  RunCodeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/submissions/run/
      Handler: index.handler
      Description: Run the student's C++ code before submitting (limited per minute and per assessment)
      Timeout: 60
      Environment:
        Variables:
          CODE_RUNNER: !Ref CodeRunner
          CODE_RUNNER_FUNCTION: !Ref RunnerFunctionName
          CODE_RUNNER_TENANT_ISOLATION: "off"
      Events:
        RunCode:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /submissions/run
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer
        OptionsRun:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /submissions/run
            Method: OPTIONS
            Auth:
              Authorizer: NONE
      Policies:
        - DynamoDBReadPolicy:
            TableName: TestCases
        - DynamoDBReadPolicy:
            TableName: Milestones
        - DynamoDBReadPolicy:
            TableName: Users
        - DynamoDBCrudPolicy:
            TableName: !Ref RunUsageTable
        - Statement:
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource:
                - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${RunnerFunctionName}"

  # ------------------------------------------
  # LAMBDA: Get Submission
  # ------------------------------------------
  GetSubmissionFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/submissions/get/
      Handler: index.handler
      Description: Get a submission by ID
      Events:
        GetSubmission:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /submissions/{submissionId}
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer
        # OPTIONS - NO AUTH (allows CORS preflight)
        OptionsSubmission:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /submissions/{submissionId}
            Method: OPTIONS
            Auth:
              Authorizer: NONE
      Policies:
        - DynamoDBReadPolicy:
            TableName: Submissions
        - DynamoDBReadPolicy:
            TableName: Users
        # A held submission (a problem with the interview) is recognised by its problem's setup when it has no flag.
        - DynamoDBReadPolicy:
            TableName: Milestones

  # ==========================================
  # PROCTORING FUNCTIONS
  # ==========================================

  # ------------------------------------------
  # LAMBDA: Generate Presigned Upload URLs
  # ------------------------------------------
  GenerateUploadUrlsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/proctoring/generate-upload-urls/
      Handler: index.handler
      Description: Generate presigned S3 URLs for proctoring recording uploads
      Events:
        GenerateUrls:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /proctoring/upload-urls
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer
        # OPTIONS - NO AUTH (allows CORS preflight)
        OptionsUploadUrls:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /proctoring/upload-urls
            Method: OPTIONS
            Auth:
              Authorizer: NONE
      Policies:
        - S3CrudPolicy:
            BucketName: micro-credentialing-recordings

  # ==========================================
  # PROCTORING: MULTIPART RECORDING UPLOAD
  # Big recordings go to S3 in 8 MiB parts (create -> presign -> complete, abort on failure) instead of one PUT.
  # The S3 key is built from the caller's user ID inside the functions. Permissions cover the recordings/ prefix only.
  # ==========================================

  # ------------------------------------------
  # LAMBDA: Start a multipart upload
  # ------------------------------------------
  MultipartCreateFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/proctoring/multipart-create/
      Handler: index.handler
      Description: Start an S3 multipart upload for a proctoring recording
      Events:
        MultipartCreate:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /proctoring/multipart/create
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer
        # OPTIONS - NO AUTH (allows CORS preflight)
        OptionsMultipartCreate:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /proctoring/multipart/create
            Method: OPTIONS
            Auth:
              Authorizer: NONE
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:PutObject
              Resource: arn:aws:s3:::micro-credentialing-recordings/recordings/*

  # ------------------------------------------
  # LAMBDA: Presigned URLs for the parts
  # ------------------------------------------
  MultipartPresignFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/proctoring/multipart-presign/
      Handler: index.handler
      Description: Presigned S3 URLs for the parts of a multipart recording upload
      Events:
        MultipartPresign:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /proctoring/multipart/presign
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer
        # OPTIONS - NO AUTH (allows CORS preflight)
        OptionsMultipartPresign:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /proctoring/multipart/presign
            Method: OPTIONS
            Auth:
              Authorizer: NONE
      Policies:
        # The presigned URLs carry the permissions of this role, so it needs PutObject for the parts to be accepted.
        - Statement:
            - Effect: Allow
              Action:
                - s3:PutObject
              Resource: arn:aws:s3:::micro-credentialing-recordings/recordings/*

  # ------------------------------------------
  # LAMBDA: Finish a multipart upload
  # ------------------------------------------
  MultipartCompleteFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/proctoring/multipart-complete/
      Handler: index.handler
      Description: Complete an S3 multipart upload of a proctoring recording
      Events:
        MultipartComplete:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /proctoring/multipart/complete
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer
        # OPTIONS - NO AUTH (allows CORS preflight)
        OptionsMultipartComplete:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /proctoring/multipart/complete
            Method: OPTIONS
            Auth:
              Authorizer: NONE
      Policies:
        # GetObject is what HeadObject needs (size of the finished file, and the retry check).
        - Statement:
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
                - s3:ListMultipartUploadParts
              Resource: arn:aws:s3:::micro-credentialing-recordings/recordings/*

  # ------------------------------------------
  # LAMBDA: Cancel a multipart upload
  # ------------------------------------------
  MultipartAbortFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/proctoring/multipart-abort/
      Handler: index.handler
      Description: Abort an S3 multipart upload of a proctoring recording
      Events:
        MultipartAbort:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /proctoring/multipart/abort
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer
        # OPTIONS - NO AUTH (allows CORS preflight)
        OptionsMultipartAbort:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /proctoring/multipart/abort
            Method: OPTIONS
            Auth:
              Authorizer: NONE
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:AbortMultipartUpload
                - s3:ListMultipartUploadParts
              Resource: arn:aws:s3:::micro-credentialing-recordings/recordings/*

  # ------------------------------------------
  # LAMBDA: Save Recording Metadata
  # ------------------------------------------
  SaveRecordingMetadataFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/proctoring/save-recording-metadata/
      Handler: index.handler
      Description: Save proctoring recording metadata to DynamoDB
      Events:
        SaveMetadata:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /proctoring/recording-metadata
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer
        # OPTIONS - NO AUTH (allows CORS preflight)
        OptionsRecordingMetadata:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /proctoring/recording-metadata
            Method: OPTIONS
            Auth:
              Authorizer: NONE
      Policies:
        - DynamoDBCrudPolicy:
            TableName: Submissions

  # ------------------------------------------
  # LAMBDA: Save Client-Side Proctoring Logs
  # ------------------------------------------
  SaveClientLogsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/proctoring/save-client-logs/
      Handler: index.handler
      Description: Persist frontend proctoring event logs on the submission record for debugging
      Events:
        SaveClientLogs:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /proctoring/client-logs
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer
        # OPTIONS - NO AUTH (allows CORS preflight)
        OptionsClientLogs:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /proctoring/client-logs
            Method: OPTIONS
            Auth:
              Authorizer: NONE
      Policies:
        - DynamoDBCrudPolicy:
            TableName: Submissions

  # ------------------------------------------
  # LAMBDA: OCR Screenshot Analysis
  # ------------------------------------------
  OcrScreenshotAnalysisFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/proctoring/ocr-screenshot-analysis/
      Handler: index.handler
      Description: Analyze screenshots with AWS Textract for OCR violation detection
      MemorySize: 512  # Textract API calls need slightly more memory
      Timeout: 30
      Events:
        AnalyzeScreenshot:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /proctoring/analyze-screenshot
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer
        # OPTIONS - NO AUTH (allows CORS preflight)
        OptionsAnalyzeScreenshot:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /proctoring/analyze-screenshot
            Method: OPTIONS
            Auth:
              Authorizer: NONE
      Policies:
        - S3ReadPolicy:
            BucketName: micro-credentialing-recordings
        - DynamoDBCrudPolicy:
            TableName: Submissions
        - Statement:
            - Effect: Allow
              Action:
                - textract:DetectDocumentText
              Resource: "*"

  # ==========================================
  # CREDENTIAL MANAGEMENT FUNCTIONS
  # ==========================================

  # ------------------------------------------
  # LAMBDA: Get User Credentials
  # ------------------------------------------
  GetUserCredentialsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/credentials/get-user-credentials/
      Handler: index.handler
      Description: Get all credentials for the current user
      Events:
        GetCredentials:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /credentials
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer
        # OPTIONS - NO AUTH (allows CORS preflight)
        OptionsCredentials:
          Type: Api
          Properties:
            RestApiId: !Ref MicroCredentialingAPI
            Path: /credentials
            Method: OPTIONS
            Auth:
              Authorizer: NONE
      Policies:
        - DynamoDBReadPolicy:
            TableName: Credentials

  # ------------------------------------------
  # LAMBDA: Get Single Credential
  # ------------------------------------------
  GetCredentialFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/credentials/get-credential/
      Handler: index.handler
      Description: Get a single credential by ID
      Events:
        GetCredential:
          Type: Api
